<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  /* La carte : 65 x 110 mm exactement, le fond remplit toute la carte */
  .carte {
    position: relative;
    width: 65mm;
    height: 110mm;
    flex: none;
    background-color: #fff;
    background-image: url("fond.png");
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: 100% 100%;
    overflow: hidden;
  }

  /* Zones de texte : positions en % de la carte (d'après le gabarit) */
  .zone {
    position: absolute;
    left: 9.5%;
    width: 82%;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    outline: 1px dashed transparent;
  }
  .zone:focus { outline: 1px dashed #2daa6a; }
  .zone.depasse { outline: 1px solid red; background: rgba(255,0,0,0.08); }

  /* Titre : Lora 9/10 pt */
  .titre {
    top: 5%;
    height: 19%;
    font-family: "Lora", serif;
    font-size: 9pt;
    line-height: 10pt;
    color: #333;
  }
  .titre i { font-weight: 400; }
  .titre b { font-weight: 600; }

  /* Points : police moderne 7 pt */
  .point {
    font-family: "Helvetica Neue", Arial, sans-serif; /* à remplacer par votre police */
    font-size: 7pt;
    line-height: 8pt;
    color: #111;
  }
  .p1 { top: 24.5%; height: 10.5%; }
  .p2 { top: 38%;   height: 12%; }
  .p3 { top: 54%;   height: 13%; }
  .p4 { top: 73%;   height: 10%; }

  .source { color: #666; font-weight: normal; }

  /* Thème en bas à droite */
  .theme {
    left: auto;
    right: 9%;
    width: 60%;
    top: 91%;
    height: 4%;
    text-align: right;
    font-family: "Helvetica Neue", Arial, sans-serif; /* à remplacer par votre police */
    font-size: 7pt;
    line-height: 8pt;
    color: #111;
  }
</style>
</head>
<body>

<div class="carte">
  <div class="zone titre" id="titre" contenteditable="true">Chargement…</div>
  <div class="zone point p1" id="p1" contenteditable="true"></div>
  <div class="zone point p2" id="p2" contenteditable="true"></div>
  <div class="zone point p3" id="p3" contenteditable="true"></div>
  <div class="zone point p4" id="p4" contenteditable="true"></div>
  <div class="zone theme" id="theme" contenteditable="true"></div>
</div>

<script>
  // Remplacez par l'adresse de VOTRE Worker (sans / à la fin)
  const WORKER = "https://asymetrie-des-baratins.valentin-c-1501.workers.dev/";

  function verifier(el) {
    el.classList.toggle("depasse", el.scrollHeight > el.clientHeight + 1);
  }
  function toutVerifier() {
    document.querySelectorAll(".zone").forEach(verifier);
  }

  // Convertit "<b>Titre.</b><br>suite <b>SOURCE</b>" : la dernière balise <b> devient la source grise
  function avecSource(html) {
    const i = html.lastIndexOf("<b>");
    if (i > 0 && html.indexOf("</b>", i) === html.length - 4 && html.slice(i).length < 60) {
      return html.slice(0, i) + '<span class="source">' + html.slice(i + 3, -4) + "</span>";
    }
    return html;
  }

  async function charger() {
    const params = new URLSearchParams(location.search);
    const num = params.get("page") || "01";
    const theme = params.get("theme") || "";
    try {
      const r = await fetch(WORKER + "/?page=" + encodeURIComponent(num));
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      document.getElementById("titre").innerHTML = d.titre;
      for (let i = 0; i < 4; i++) {
        document.getElementById("p" + (i + 1)).innerHTML = avecSource(d.points[i] || "");
      }
      document.getElementById("theme").textContent = theme;
    } catch (e) {
      document.getElementById("titre").textContent = "Erreur : " + e.message;
    }
    toutVerifier();
    if (document.fonts) document.fonts.ready.then(toutVerifier);
  }

  document.querySelectorAll(".zone").forEach(function (el) {
    el.addEventListener("input", function () { verifier(el); });
  });
  charger();
  // Rafraîchit toutes les 15 secondes pour suivre vos modifications Notion
  setInterval(charger, 15000);
</script>

</body>
</html>
