<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .carte {
    position: relative;
    width: 65mm;
    height: 110mm;
    flex: none;
    background-color: #fff;
    background-image: url("fond.png");
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: 100% 100%;
    overflow: hidden;
  }

  .zone {
    position: absolute;
    left: 9.5%;
    width: 82%;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    outline: 1px dashed transparent;
  }
  .zone.depasse { outline: 1px solid red; background: rgba(255,0,0,0.08); }

  .titre {
    top: 5%;
    height: 19%;
    font-family: "Lora", serif;
    font-size: 9pt;
    line-height: 10pt;
    color: #333;
  }
  .titre i { font-weight: 400; }
  .titre b { font-weight: 600; }

  .point {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 7pt;
    line-height: 8pt;
    color: #111;
  }
  .p1 { top: 24.5%; height: 10.5%; }
  .p2 { top: 38%;   height: 12%; }
  .p3 { top: 54%;   height: 13%; }
  .p4 { top: 73%;   height: 10%; }

  .theme {
    left: auto;
    right: 9%;
    width: 60%;
    top: 91%;
    height: 4%;
    text-align: right;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 7pt;
    line-height: 8pt;
    color: #111;
  }

  #statut {
    position: fixed;
    top: 4px;
    left: 8px;
    font: 11px Arial, sans-serif;
    color: #888;
  }
</style>
</head>
<body>

<div id="statut"></div>

<div class="carte">
  <div class="zone titre" id="titre"></div>
  <div class="zone point p1" id="p1"></div>
  <div class="zone point p2" id="p2"></div>
  <div class="zone point p3" id="p3"></div>
  <div class="zone point p4" id="p4"></div>
  <div class="zone theme" id="theme">Écologie & Environnement</div>
</div>

<script>
  var WORKER = "https://asymetrie-des-baratins.valentin-c-1501.workers.dev/";

  function verifier(el) {
    el.classList.toggle("depasse", el.scrollHeight > el.clientHeight + 1);
  }
  function toutVerifier() {
    document.querySelectorAll(".zone").forEach(verifier);
  }

  function remplir(data) {
    document.getElementById("titre").innerHTML = data.titre || "";
    var pts = data.points || [];
    for (var i = 0; i < 4; i++) {
      document.getElementById("p" + (i + 1)).innerHTML = pts[i] || "";
    }
    toutVerifier();
  }

  function charger() {
    var params = new URLSearchParams(location.search);
    var page = params.get("page");
    var statut = document.getElementById("statut");
    if (!page) {
      statut.textContent = "Aucun ?page= dans le lien";
      return;
    }
    fetch(WORKER + "?page=" + encodeURIComponent(page))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) { statut.textContent = "Erreur : " + data.error; return; }
        statut.textContent = "";
        remplir(data);
      })
      .catch(function (e) { statut.textContent = "Erreur de chargement"; });
  }

  charger();
  /* Rafraîchit toutes les 5 secondes pour suivre vos modifications dans Notion */
  setInterval(charger, 5000);

  window.addEventListener("load", toutVerifier);
  if (document.fonts) document.fonts.ready.then(toutVerifier);
</script>

</body>
</html>
