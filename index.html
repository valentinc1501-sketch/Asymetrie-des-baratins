<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .carte {
    position: relative;
    width: 65mm;
    height: 110mm;
    flex: none;
    background-color: #fff;
    background-image: url("fond.png");
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: 100% 100%;
    overflow: hidden;
  }

  /* BLOC 1 : idée reçue, hauteur selon le texte */
  .titre {
    position: absolute;
    left: 9.5%;
    width: 82%;
    top: 5%;
    box-sizing: border-box;
    font-family: "Lora", serif;
    font-size: 9pt;
    line-height: 10pt;
    color: #333;
  }
  .titre i { font-weight: 400; }
  .titre b { font-weight: 600; }

  /* BLOC 2 : arguments (zone noire du gabarit) */
  .corps {
    position: absolute;
    left: 9.5%;
    width: 82%;
    /* top est calculé par le script, juste sous le titre */
    bottom: 12.5%;           /* limite basse du bloc noir */
    box-sizing: border-box;
    overflow: hidden;
    font-family: "Helvetica Neue", Arial, sans-serif; /* à remplacer par votre police */
    font-size: 7pt;
    line-height: 8pt;
    color: #111;
  }
  .corps .pt { margin: 0 0 6pt 0; }   /* espace entre deux arguments */
  .corps .pt:last-child { margin-bottom: 0; }

  .depasse { outline: 1px solid red; background: rgba(255,0,0,0.08); }

  .theme {
    position: absolute;
    right: 9%;
    width: 60%;
    top: 91%;
    text-align: right;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 7pt;
    line-height: 8pt;
    color: #111;
  }

  #statut {
    position: fixed;
    top: 4px;
    left: 8px;
    font: 11px Arial, sans-serif;
    color: #888;
  }
</style>
</head>
<body>

<div id="statut"></div>

<div class="carte" id="carte">
  <div class="titre" id="titre"></div>
  <div class="corps" id="corps"></div>
  <div class="theme" id="theme">Écologie & Environnement</div>
</div>

<script>
  var WORKER = "https://asymetrie-des-baratins.valentin-c-1501.workers.dev/";

  /* Mettre true pour réduire automatiquement la taille du texte si ça dépasse */
  var reduireAuto = false;

  /* Espace (en mm) entre le bas de l'idée reçue et le début des arguments */
  var ESPACE_MM = 7;

  function mmEnPx(mm) { return mm * 96 / 25.4; }

  function mettreEnPage() {
    var carte = document.getElementById("carte");
    var titre = document.getElementById("titre");
    var corps = document.getElementById("corps");

    /* le bloc 2 démarre juste sous le bloc 1 */
    var bas = titre.offsetTop + titre.offsetHeight + mmEnPx(ESPACE_MM);
    corps.style.top = bas + "px";

    /* réduction automatique optionnelle */
    corps.style.fontSize = "";
    corps.style.lineHeight = "";
    if (reduireAuto) {
      var taille = 7;
      while (corps.scrollHeight > corps.clientHeight + 1 && taille > 5) {
        taille -= 0.25;
        corps.style.fontSize = taille + "pt";
        corps.style.lineHeight = (taille + 1) + "pt";
      }
    }

    corps.classList.toggle("depasse", corps.scrollHeight > corps.clientHeight + 1);
  }

  function remplir(data) {
    document.getElementById("titre").innerHTML = data.titre || "";
    var pts = data.points || [];
    var html = "";
    for (var i = 0; i < pts.length; i++) {
      if (pts[i]) html += '<div class="pt">' + pts[i] + "</div>";
    }
    document.getElementById("corps").innerHTML = html;
    mettreEnPage();
  }

  function charger() {
    var params = new URLSearchParams(location.search);
    var page = params.get("page");
    var statut = document.getElementById("statut");
    if (!page) {
      statut.textContent = "Aucun ?page= dans le lien";
      return;
    }
    fetch(WORKER + "?page=" + encodeURIComponent(page))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) { statut.textContent = "Erreur : " + data.error; return; }
        statut.textContent = "";
        remplir(data);
      })
      .catch(function () { statut.textContent = "Erreur de chargement"; });
  }

  charger();
  setInterval(charger, 5000);

  window.addEventListener("load", mettreEnPage);
  if (document.fonts) document.fonts.ready.then(mettreEnPage);
</script>

</body>
</html>
